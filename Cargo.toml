[package]
name = "tdc-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "io-std", "signal"] }
reqwest = { version = "=0.12.8", default-features = false, features = ["native-tls", "json", "gzip", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
base64 = "0.22"
flate2 = "1.0"
rand = "0.8"
anyhow = "1.0"
urlencoding = "2.1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3.34", features = ["sink"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
